<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>İlgi Alanlarım - Müzik</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">Portfolyo</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Hakkımda</a></li>
          <li class="nav-item"><a class="nav-link" href="cv.html">CV</a></li>
          <li class="nav-item"><a class="nav-link" href="sehrim.html">Şehrim</a></li>
          <li class="nav-item"><a class="nav-link" href="miras.html">Mirasımız</a></li>
          <li class="nav-item"><a class="nav-link active" href="ilgi.html">İlgi Alanlarım</a></li>
          <li class="nav-item"><a class="nav-link" href="iletisim.html">İletişim</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Giriş</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <div class="container">
      <h1 class="display-4 fw-bold">İlgi Alanlarım</h1>
      <p class="lead mt-3">Müzik dünyasını keşfet</p>
    </div>
  </section>

  <!-- ARAMA -->
  <section class="py-5">
    <div class="container">
      <h2 class="baslik">Müzik Ara</h2>
      <p class="text-muted">Sanatçı veya şarkı adı yaz, iTunes'dan sonuçlar gelsin.</p>

      <div class="row justify-content-center mt-4">
        <div class="col-md-6">
          <div class="input-group">
            <input type="text"
                   id="aramaKutusu"
                   class="form-control form-control-lg"
                   placeholder="Sanatçı veya şarkı ara..." />
            <button class="btn btn-danger btn-lg" onclick="muzikAra()">
              <i class="bi bi-search"></i> Ara
            </button>
          </div>
        </div>
      </div>

      <!-- SONUÇLAR -->
      <div id="yukleniyor" class="text-center mt-4 d-none">
        <div class="spinner-border text-danger" role="status"></div>
        <p class="mt-2">Yükleniyor...</p>
      </div>

      <div id="sonuclar" class="row g-4 mt-4"></div>

    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2025 Rümeysa Akbulut · Sakarya Üniversitesi</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function muzikAra() {
      const aranan = document.getElementById('aramaKutusu').value.trim();

      if (aranan === '') {
        alert('Lütfen bir şeyler yaz!');
        return;
      }

      // Yükleniyor gösterme
      document.getElementById('yukleniyor').classList.remove('d-none');
      document.getElementById('sonuclar').innerHTML = '';

      // iTunes API'ye istek at
      const url = `https://itunes.apple.com/search?term=${encodeURIComponent(aranan)}&media=music&limit=12&lang=tr_tr`;

      fetch(url)
        .then(response => response.json())
        .then(data => {
          document.getElementById('yukleniyor').classList.add('d-none');

          if (data.results.length === 0) {
            document.getElementById('sonuclar').innerHTML = '<p class="text-muted text-center">Sonuç bulunamadı.</p>';
            return;
          }

          let html = '';
          data.results.forEach(sarki => {
            html += `
              <div class="col-md-3 col-sm-6">
                <div class="card h-100 text-center p-3">
                  <img src="${sarki.artworkUrl100}"
                       alt="${sarki.trackName}"
                       class="rounded mx-auto d-block"
                       style="width:100px; height:100px;" />
                  <h6 class="mt-3 fw-bold">${sarki.trackName}</h6>
                  <p class="text-muted small">${sarki.artistName}</p>
                  <p class="text-muted small">${sarki.collectionName || ''}</p>
                  ${sarki.previewUrl ? `
                    <audio controls class="w-100 mt-2">
                      <source src="${sarki.previewUrl}" type="audio/mpeg" />
                    </audio>
                  ` : ''}
                </div>
              </div>
            `;
          });

          document.getElementById('sonuclar').innerHTML = html;
        })
        .catch(error => {
          document.getElementById('yukleniyor').classList.add('d-none');
          document.getElementById('sonuclar').innerHTML = '<p class="text-danger text-center">Bir hata oluştu, tekrar dene!</p>';
        });
    }

    // Enter tuşu ile de arama yapma
    document.getElementById('aramaKutusu').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') muzikAra();
    });
  </script>

</body>
</html>
