<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş Yap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>

  <div class="login-wrapper">
    <div class="card login-card">

      <h2 class="text-center fw-bold mb-4" style="color:#2c3e50;">
        <i class="bi bi-lock-fill text-danger me-2"></i>Giriş Yap
      </h2>

      <div id="hata"></div>

      <form id="loginForm" action="php/login_kontrol.php" method="POST">

        <!-- KULLANICI ADI -->
        <div class="mb-3">
          <label class="form-label fw-bold">Kullanıcı Adı</label>
          <input type="text"
                 id="kullaniciAdi"
                 name="kullaniciAdi"
                 class="form-control"
                 placeholder="E-posta" />
        </div>

        <!-- ŞİFRE -->
        <div class="mb-4">
          <label class="form-label fw-bold">Şifre</label>
          <input type="password"
                 id="sifre"
                 name="sifre"
                 class="form-control"
                 placeholder="Şifrenizi girin" />
        </div>

        <!-- GİRİŞ BUTONU -->
        <button type="button" class="btn btn-primary w-100 btn-lg" onclick="loginKontrol()">
          <i class="bi bi-box-arrow-in-right me-1"></i> Giriş Yap
        </button>

      </form>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // URL'den hata parametresi var mı kontrol et
    window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('hata') === 'yanlis') {
        document.getElementById('hata').innerHTML = '<div class="alert alert-danger">Kullanıcı adı veya şifre yanlış!</div>';
    }
    if (params.get('hata') === 'bos') {
        document.getElementById('hata').innerHTML = '<div class="alert alert-danger">Kullanıcı adı ve şifre boş bırakılamaz!</div>';
    }
    }

    function loginKontrol() {
    const kullanici = document.getElementById('kullaniciAdi').value.trim();
    const sifre = document.getElementById('sifre').value.trim();
    const hataDiv = document.getElementById('hata');

    if (kullanici === '' || sifre === '') {
        hataDiv.innerHTML = '<div class="alert alert-danger">Kullanıcı adı ve şifre boş bırakılamaz!</div>';
        return;
    }

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(kullanici)) {
        hataDiv.innerHTML = '<div class="alert alert-danger">Kullanıcı adı e-posta formatında olmalıdır!</div>';
    return;
    }

    document.getElementById('loginForm').submit();
    }
  </script>

</body>
</html>
